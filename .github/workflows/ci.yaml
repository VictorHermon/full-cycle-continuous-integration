name: ci-golang
on:
  pull_request:
    branches:
      - develop
jobs:
  check-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.26, 1.25]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go version ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run math
        run: go run math.go
      - name: Test
        run: go test -v
