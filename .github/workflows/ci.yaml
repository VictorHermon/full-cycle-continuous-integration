name: ci-golang
on:
  push:
    branches: [main]
jobs:
  check-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
      - name: Run math
        run: go run math.go
      - name: Test
        run: go test -v
